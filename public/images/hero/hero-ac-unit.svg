<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle room lighting gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- AC unit glossy body gradient -->
    <linearGradient id="acBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Metallic trim gradient -->
    <linearGradient id="metalTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Airflow cool glow -->
    <linearGradient id="coolFlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="coolFlowAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="unitShadow" x="-10%" y="-10%" width="125%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0B1F3A" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B1F3A" flood-opacity="0.08" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Room Interior Background -->
  <rect width="800" height="600" rx="20" fill="url(#wallGrad)" />

  <!-- Clean Interior Architectural Elements (Corner & Subtle Window Light) -->
  <path d="M0 0 L240 0 L180 600 L0 600 Z" fill="#FFFFFF" fill-opacity="0.5" />
  <line x1="720" y1="0" x2="720" y2="600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="680" y1="0" x2="680" y2="600" stroke="#E2E8F0" stroke-width="1" />

  <!-- Subtle grid texture suggesting technical precision -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="1.5" fill="#0B1F3A" />
    <circle cx="140" cy="100" r="1.5" fill="#0B1F3A" />
    <circle cx="180" cy="100" r="1.5" fill="#0B1F3A" />
    <circle cx="100" cy="140" r="1.5" fill="#0B1F3A" />
    <circle cx="140" cy="140" r="1.5" fill="#0B1F3A" />
    <circle cx="180" cy="140" r="1.5" fill="#0B1F3A" />
  </g>

  <!-- Cool Air Streams Emanating from AC Louver -->
  <g opacity="0.9">
    <!-- Diffuse Cool Waves -->
    <path d="M170 260 C 170 340, 130 420, 80 500 L 260 500 C 270 420, 260 340, 250 260 Z" fill="url(#coolFlow)" />
    <path d="M280 260 C 290 350, 280 430, 260 520 L 520 520 C 510 430, 500 350, 510 260 Z" fill="url(#coolFlow)" />
    <path d="M530 260 C 530 340, 560 420, 620 500 L 720 500 C 670 420, 630 340, 615 260 Z" fill="url(#coolFlow)" />

    <!-- Crisp Air Flow Trajectory Lines -->
    <path d="M220 265 C 210 320, 170 380, 130 440" stroke="url(#coolFlowAccent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6" />
    <path d="M340 265 C 340 330, 330 400, 320 480" stroke="url(#coolFlowAccent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 8" />
    <path d="M400 265 C 400 340, 400 410, 400 490" stroke="#0284C7" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" />
    <path d="M460 265 C 460 330, 470 400, 480 480" stroke="url(#coolFlowAccent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 8" />
    <path d="M570 265 C 580 320, 620 380, 660 440" stroke="url(#coolFlowAccent)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6" />
  </g>

  <!-- Modern Wall-Mounted Split AC Indoor Unit -->
  <g filter="url(#unitShadow)">
    <!-- Base Chassis -->
    <rect x="130" y="110" width="540" height="150" rx="16" fill="url(#acBody)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Top air intake louvers / vents -->
    <rect x="155" y="122" width="490" height="18" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <line x1="170" y1="128" x2="630" y2="128" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="5 3" />
    <line x1="170" y1="134" x2="630" y2="134" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="5 3" />

    <!-- Lower Bevel & Bottom Air Discharge Flap (Louver) -->
    <path d="M132 230 Q 400 242 668 230 L 665 255 Q 400 262 135 255 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <line x1="140" y1="238" x2="660" y2="238" stroke="url(#metalTrim)" stroke-width="2.5" />

    <!-- Horizontal Sleek Metallic Trim Strip -->
    <line x1="132" y1="210" x2="668" y2="210" stroke="url(#metalTrim)" stroke-width="1.5" />

    <!-- Brand Display Zone (Clean Minimalist Aesthetic) -->
    <rect x="525" y="155" width="105" height="42" rx="8" fill="#0B1F3A" fill-opacity="0.04" />
    
    <!-- LED Temperature Display (24°C Inverter Cooling) -->
    <circle cx="550" cy="176" r="3" fill="#0284C7" />
    <text x="565" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0284C7" letter-spacing="-0.5">24°</text>

    <!-- Subtle Inverter / Eco Indicator -->
    <text x="550" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="0.5">INVERTER</text>

    <!-- Minimalist AC Power / Sensor Eye -->
    <circle cx="638" cy="176" r="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <circle cx="638" cy="176" r="1.5" fill="#10B981" />
  </g>

  <!-- Technical Spec & Trust Floating Badge (Clean Local Business Verification) -->
  <g filter="url(#badgeShadow)">
    <rect x="110" y="440" width="270" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="122" y="456" width="36" height="36" rx="10" fill="#0B1F3A" />
    <path d="M136 470 L140 474 L148 466" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="170" y="473" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B1F3A">Split &amp; Window AC Service</text>
    <text x="170" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="500" fill="#475569">Direct Technician Response</text>
    <text x="170" y="512" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1E5388">Indore &bull; Rau &bull; Pithampur</text>
  </g>

  <!-- Rapid Response Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="490" y="455" width="220" height="80" rx="14" fill="#0B1F3A" stroke="#163056" stroke-width="1.5" />
    <circle cx="516" cy="495" r="16" fill="#163056" />
    <path d="M516 487 V495 L522 498" stroke="#0284C7" stroke-width="2" stroke-linecap="round" />
    
    <text x="542" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">On-Site Diagnosis</text>
    <text x="542" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Installation &bull; Repair &bull; Gas</text>
  </g>
</svg>
